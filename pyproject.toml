[project]
name = "multiprocessing-logging"
version = "0.3.4"
description = "Logger for multiprocessing applications"
readme = "README.md"
license = { text = "LGPLv3" }
requires-python = ">=2.7"

[project.optional-dependencies]
test = [
  "mock~=3.0; python_version < '3.3'",
]

[tool.black]
line-length = 100
target-version = ['py310']
preview = true

[tool.isort]
skip_gitignore = true
balanced_wrapping = true
include_trailing_comma = true
py_version = 310
line_length = 100
multi_line_output = 3
use_parentheses = true
order_by_type = false

[tool.coverage.run]
source = ["multiprocessing_logging"]

[tool.mypy]
python_version = '3.10'

files = "."
exclude = "build"

# Display the codes needed for # type: ignore[code] annotations.
show_error_codes = true

# Options to make the checking stricter.
# Python 2 does not allow for annotations.
#check_untyped_defs = true
#disallow_untyped_defs = true
#disallow_any_generics = true
warn_no_return = true
strict_optional = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

# We use a lot of third-party libraries we don't have stubs for, as
# well as a handful of our own modules that we haven't told mypy how
# to find.  Ignore them.  (For some details, see:
# `git log -p -S ignore_missing_imports mypy.ini`.)
#
# This doesn't get in the way of using the stubs we *do* have.
ignore_missing_imports = true

# Warn of unreachable or redundant code.
warn_unreachable = true

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.tox]
requires = ["tox>=4"]
env_list = ["py37", "py38", "py39", "py310", "py311", "py312", "py313", "pypy", "pypy3", "type"]

[tool.tox.env.pypy3]
base_python = ["pypy3.11"]

[tool.tox.env_run_base]
description = "Run test under {base_python}"
deps = [".[test]"]
commands = [["python", "-m", "unittest", "discover", "--quiet", "--start-directory", "tests", "--top-level-directory", "."]]

[tool.tox.env.type]
description = "run type check on code base"
base_python = ["py313"]
deps = ["mypy"]
commands = [["mypy"]]
